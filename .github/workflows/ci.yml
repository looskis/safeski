name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Hosted macOS runners are virtual machines with no Secure Enclave. Tests marked
    # `.requiresEnclave` skip here; parsing, policy, protocol, proxy, and encoding tests run.
    # Run `swift test` on a real Mac for the full suite.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build + ad-hoc sign
        run: make build sign
      - name: Client syntax checks
        run: |
          python3 -m py_compile clients/python/safeski.py
          node --check clients/node/safeski.js
          sh -n clients/shell/safeski-get scripts/install.sh scripts/uninstall.sh
      - name: Install to a temp prefix
        run: scripts/install.sh --prefix "$RUNNER_TEMP/prefix" --no-agent --no-build && "$RUNNER_TEMP/prefix/bin/safeski" --version
